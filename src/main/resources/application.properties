spring.application.name=fintrack

# ==========================================
# PostgreSQL
# ==========================================

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/fintrack}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD}

# ==========================================
# JPA / Hibernate
# ==========================================

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# ==========================================
# Server
# ==========================================

server.port=${PORT:8080}

app.frontend-url=${FRONTEND_URL:http://localhost:5173}

# ==========================================
# JWT
# ==========================================

app.jwt.secret=${JWT_SECRET}
app.jwt.access-expiration=900000
app.jwt.refresh-expiration=604800000

# ==========================================
# Connection Pool
# ==========================================

spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000

# ==========================================
# Recurring Transactions
# ==========================================

fintrack.recurring.cron=0 0 2 * * *

# ==========================================
# Spring AI - Google Gemini
# ==========================================

spring.ai.google.genai.api-key=${GEMINI_API_KEY}
spring.ai.google.genai.chat.options.model=gemini-3.8-flash
spring.ai.google.genai.chat.options.temperature=0.3

# ==========================================
# Google OAuth2
# ==========================================

spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET}
spring.security.oauth2.client.registration.google.scope=openid,profile,email
spring.security.oauth2.client.registration.google.redirect-uri={baseUrl}/login/oauth2/code/{registrationId}

# ==========================================
# Logging
# ==========================================

logging.level.com.fintrack.security=INFO
logging.level.org.springframework.security=INFO